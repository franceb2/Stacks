# XcodeGen project spec. GitHub Actions turns this into Stacks.xcodeproj, so no Mac is needed.
name: Stacks
options:
  bundleIdPrefix: io.github.stacksreader
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Stacks:
    type: application
    platform: iOS
    sources:
      - Stacks
    info:
      path: Stacks/Info.plist
      properties:
        CFBundleDisplayName: Stacks
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Kavita on a home PC is plain http, so allow it (and in-book images in the web view).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Stacks connects to the Kavita server on your PC to load your books and comics.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.stacksreader.Stacks
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
