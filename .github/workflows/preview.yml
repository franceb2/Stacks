name: Preview page

# Every change gets screenshots and a walkthrough video at https://<user>.github.io/<repo>/
# Manual only: run it from the Actions tab when you want screenshots.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run app in simulator and capture
        run: bash ci/preview.sh

      - name: Save capture
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: site

  publish:
    needs: capture
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview-site
          path: site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
